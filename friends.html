<!doctype html>
<html lang="ko"><head><script src="theme.js?v=20261104-1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>친구 — study</title><link rel="stylesheet" href="styles.css?v=20261106-world4"><script src="navigation.js?v=20261105-shop10"></script><script type="module" src="app.js?v=20261106-world5"></script></head><body><div class="app">
<header class="header"><a class="brand" href="index.html">STUDY.</a><a class="profile-dot" href="account.html" aria-label="내 계정">·</a></header>
<main aria-label="친구" class="friends-page"><section data-social><p data-social-login>친구 정보를 불러오는 중…</p><div data-social-content hidden><section id="friends-panel" class="friends-fullscreen" aria-labelledby="friends-panel-title"><div class="social-dialog-heading"><div><p class="tiny muted">함께 공부하는 친구</p><h2 id="friends-panel-title">친구</h2></div><a class="social-dialog-close" href="play.html" aria-label="친구 화면 닫기">×</a></div><p class="auth-status is-error" data-social-error role="status" hidden></p><div class="social-dialog-body">
<section class="card"><h2>내 친구</h2><button class="friend-self" type="button" data-friend-self>내 프로필 꾸미기</button><div data-friend-list>불러오는 중…</div></section><details data-friend-add><summary class="secondary-button" aria-expanded="false">친구 추가</summary><div class="friend-add-body"><section class="card"><h2>친구 코드</h2><p class="tiny muted">내 코드를 친구에게 알려주세요. 친구가 입력하면 나에게 요청이 와요.</p><div class="friend-code-row"><strong data-friend-code>코드 만들기를 눌러 주세요</strong><button type="button" class="social-button" data-social-action="code">내 코드 만들기</button><button type="button" class="social-button" data-social-action="copy">복사</button></div>
<form class="social-inline-form" data-social-form="request"><label class="form-field">친구 코드 입력<input name="code" placeholder="6자리 코드 (예: K7M2PX)" minlength="6" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label><button type="submit" class="primary-button">친구 요청</button></form><p class="tiny muted">긴 내 코드는 ‘내 코드 만들기’를 눌러 새 6자리 코드로 바꿔 주세요.</p></section>
<section class="card"><div class="section-title"><h2>받은 친구 요청</h2><button type="button" class="social-button" data-social-action="refresh" data-social-scope="requests" aria-label="친구 요청 목록 새로고침">새로고침</button></div><p class="tiny muted social-refresh-status" data-social-refresh-status="requests" role="status"></p><div data-friend-requests>불러오는 중…</div><details class="social-sent"><summary>보낸 요청 보기</summary><div data-sent-requests></div></details></section>
</div></details>
</div></section></div><dialog class="goal-dialog" data-social-confirm aria-labelledby="social-confirm-title"><h2 id="social-confirm-title">계속할까요?</h2><p class="report-note" data-confirm-text></p><div class="social-actions"><button type="button" class="social-button" data-social-action="dismiss">취소</button><button type="button" class="social-button social-danger" data-social-action="confirm" data-confirm-action>확인</button></div></dialog>
